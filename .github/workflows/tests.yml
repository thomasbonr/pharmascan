name: Tests

# Unit tests (GS1 parsing, BDPM quantities, Python reference port of the GS1
# rules), Android lint and an unsigned release build. No device needed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin unit tests, lint, release build
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease

      - name: GS1 reference tests (Python)
        working-directory: tools/gs1_reference
        run: python3 test_gs1.py
